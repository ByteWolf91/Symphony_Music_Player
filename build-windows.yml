name: Build Symphony for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
              pip install -r requirements.txt
          }

          if (Test-Path "files/requirements.txt") {
              pip install -r files/requirements.txt
          }

          pip install pyinstaller

      - name: Build EXE
        shell: powershell
        run: |
          cd files
          pyinstaller --noconfirm --clean --onefile --windowed --name Symphony *.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Symphony-Windows
          path: files/dist/Symphony.exe
