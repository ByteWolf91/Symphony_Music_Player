name: Build Symphony EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Symphony
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Install dependencies
        shell: powershell
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          if (Test-Path "files\requirements.txt") {
            python -m pip install -r files\requirements.txt
          }

      - name: Find Python files
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.py -Recurse

      - name: Build Symphony
        shell: powershell
        run: |
          cd files
          pyinstaller --noconfirm --clean --onefile --windowed --name Symphony *.py

      - name: Upload Symphony EXE
        uses: actions/upload-artifact@v4
        with:
          name: Symphony-Windows
          path: files\dist\Symphony.exe
